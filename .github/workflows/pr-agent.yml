name: PR Agent

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited, converted_to_draft]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Número de PR abierta
        required: true
        type: string
      command:
        description: Análisis a ejecutar
        type: choice
        options: [both, review, improve]
        default: both
      publish:
        description: Publicar comentarios en GitHub
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # The draft event cancels any previous run through workflow concurrency.
    # Only trusted default-branch code runs with secrets; never checkout PR code.
    if: >-
      github.repository == 'Netbel/vue-sortable' &&
      ((github.event_name == 'pull_request_target' &&
        !github.event.pull_request.draft) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout de la configuración confiable
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/pr-agent
            docs/review
            .pr_agent.toml
          sparse-checkout-cone-mode: false

      - name: Ejecutar revisión
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_AGENT_ENABLED: ${{ vars.PR_AGENT_ENABLED || 'true' }}
          PR_AGENT_MODEL: ${{ vars.PR_AGENT_MODEL || 'gemini/gemini-3.5-flash-lite' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: python3 .github/pr-agent/run_review.py

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-agent-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.run_attempt }}
          path: pr-agent-results/**/*.md
          if-no-files-found: ignore
          retention-days: 7
